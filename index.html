<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Name — Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --soft: #f4f5f7;
    --ink: #15171c;
    --muted: #70757f;
    --line: #e6e7ea;
    --accent: #2d4bff;
    --gold-ink: #8a6100;
    --gold-bg: #fbefc8;
    --font: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101114; --soft: #1a1c20; --ink: #f1f2f4; --muted: #8b909a; --line: #25272d; --accent: #7d92ff; --gold-ink: #f0c24b; --gold-bg: rgba(240, 194, 75, .14); }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 72px; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--font); font-weight: 400; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  body:has(dialog[open]) { overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  img { max-width: 100%; display: block; }
  body { position: relative; }

  /* side margins: a light bar on each side with evenly spaced engineering/science icons (wide screens only) */
  :root { --deco-opacity: .75; }
  @media (prefers-color-scheme: dark) { :root { --deco-opacity: .6; } }
  .deco { position: absolute; inset: 0; pointer-events: none; overflow: hidden; display: none; }
  .deco-side { position: absolute; top: 0; bottom: 0; width: calc((100% - 1100px) / 2); }
  .deco-side.left { left: 0; }
  .deco-side.right { right: 0; }
  .deco-bar {
    position: absolute; top: 96px; bottom: 96px; left: 50%; width: 52px; transform: translateX(-50%);
    border-radius: 26px; background: var(--soft);
  }
  .deco-icons { position: absolute; inset: 18px 0; opacity: var(--deco-opacity); background-repeat: repeat-y; background-position: center top; }
  @media (min-width: 1260px) { .deco { display: block; } }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 56px); }

  /* nav */
  .nav {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 56px; }
  .nav-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-links { display: flex; gap: clamp(14px, 3vw, 28px); font-size: .95rem; color: var(--muted); }
  .nav-links a:hover { color: var(--ink); }

  /* profile */
  .profile {
    display: grid; grid-template-columns: clamp(220px, 28vw, 320px) 1fr; gap: clamp(24px, 5vw, 56px);
    padding: clamp(48px, 10vh, 96px) 0 clamp(40px, 8vh, 72px); align-items: stretch;
  }
  /* portrait photo stretches to the full height of the profile text */
  #photo { position: relative; min-height: 360px; }
  .photo {
    position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 16px;
    object-fit: cover; background: var(--soft);
    display: grid; place-items: center; font-size: 3rem; font-weight: 300; color: var(--muted);
  }
  h1 { font-size: clamp(2.2rem, 6vw, 4rem); font-weight: 300; line-height: 1.05; letter-spacing: -0.035em; }
  .tagline { margin-top: 10px; font-size: 1.15rem; color: var(--muted); }
  .bio { margin-top: 18px; max-width: 40em; }
  .contact { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: .95rem; }
  .contact a { border-bottom: 1px solid var(--accent); padding-bottom: 1px; }
  .contact a:hover { color: var(--accent); }
  .lists { margin-top: 28px; display: flex; flex-direction: column; gap: 22px; }
  .skill-groups { display: grid; grid-template-columns: max-content 1fr; gap: 10px 16px; align-items: baseline; }
  .skill-groups dt { font-size: .9rem; font-weight: 700; }
  .lists h3 { font-size: .85rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { font-size: .85rem; padding: 3px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); }
  .awards { display: flex; flex-wrap: wrap; gap: 6px; }
  .awards span {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: .8rem; font-weight: 600; padding: 3px 10px 3px 8px; border-radius: 999px;
    color: var(--gold-ink); background: var(--gold-bg);
    border: 1px solid color-mix(in srgb, var(--gold-ink) 30%, transparent);
  }
  .awards svg, .badge svg { width: 13px; height: 13px; flex: none; }
  .section-intro { max-width: 46em; margin: -12px 0 28px; line-height: 2; }
  .section-intro .badge {
    display: inline-flex; align-items: center; gap: 5px; vertical-align: 1px;
    font-size: .85rem; font-weight: 600; line-height: 1.5; padding: 1px 10px 1px 8px; border-radius: 999px;
    color: var(--gold-ink); background: var(--gold-bg);
    border: 1px solid color-mix(in srgb, var(--gold-ink) 30%, transparent);
  }

  /* sections */
  section.block { padding: clamp(40px, 8vh, 72px) 0; border-top: 1px solid var(--line); }
  h2.section-title { font-size: clamp(1.6rem, 3.5vw, 2.2rem); font-weight: 500; letter-spacing: -0.025em; margin-bottom: 28px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(16px, 2.5vw, 28px); }
  .grid.three { grid-template-columns: repeat(3, 1fr); }

  /* cards */
  .card {
    all: unset; box-sizing: border-box; cursor: pointer;
    display: flex; flex-direction: column;
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    background: var(--bg); transition: border-color .2s, transform .2s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .cover { aspect-ratio: 16 / 10; background: var(--soft); position: relative; }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .card-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card-title { font-size: 1.25rem; font-weight: 500; letter-spacing: -0.015em; line-height: 1.25; }
  .meta { font-size: .9rem; color: var(--muted); }
  .summary { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 4; line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .more { margin-top: auto; padding-top: 4px; font-size: .9rem; color: var(--accent); }

  /* modal */
  dialog {
    width: min(760px, calc(100% - 32px)); max-height: calc(100dvh - 32px);
    margin: auto; border: 1px solid var(--line); border-radius: 16px;
    background: var(--bg); color: var(--ink); overflow-y: auto; overscroll-behavior: contain;
  }
  dialog::backdrop { background: rgba(10, 11, 14, .6); }
  .modal-inner { padding: clamp(22px, 4vw, 40px); padding-top: 8px; }
  .modal-close {
    position: sticky; top: 0; display: flex; justify-content: flex-end;
    padding: 12px 12px 0; background: linear-gradient(var(--bg) 70%, transparent);
  }
  .modal-close button {
    all: unset; cursor: pointer; width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center; font-size: 1.4rem; color: var(--muted); background: var(--soft);
  }
  .modal-close button:hover { color: var(--ink); }
  .modal-close button:focus-visible { outline: 2px solid var(--accent); }
  #modal-title { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 500; letter-spacing: -0.025em; line-height: 1.15; }
  .modal-inner .meta { margin-top: 6px; }
  .modal-inner .meta a, .details a, .section a { color: var(--ink); border-bottom: 1px solid var(--accent); }
  .modal-inner .meta a:hover, .details a:hover, .section a:hover { color: var(--accent); }
  .section { margin-top: 30px; }
  .section h3 { font-size: .85rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 10px; }
  .section p + p { margin-top: 12px; }
  .section ol { margin-top: 12px; padding-left: 1.4em; display: flex; flex-direction: column; gap: 8px; }
  .section .media { margin-top: 18px; }
  .modal-inner .chips, .modal-inner .awards { margin-top: 14px; }
  .details { margin-top: 22px; display: flex; flex-direction: column; gap: 12px; }
  .media { margin-top: 28px; display: flex; flex-direction: column; gap: 24px; }
  .media figure { display: flex; flex-direction: column; gap: 8px; }
  .media img, .media video { width: 100%; border-radius: 10px; background: var(--soft); }
  .media iframe { width: 100%; border: 0; border-radius: 10px; background: var(--soft); }
  .media iframe.video { aspect-ratio: 16 / 9; }
  /* rotated images: box takes the rotated shape, image is turned inside it */
  .rot { position: relative; width: 100%; aspect-ratio: 16 / 9; container-type: size; overflow: hidden; border-radius: 10px; background: var(--soft); }
  .media .rot img {
    position: absolute; top: 50%; left: 50%; width: 100cqh; height: 100cqw; max-width: none;
    object-fit: contain; border-radius: 0; transform: translate(-50%, -50%) rotate(var(--r));
  }
  .media iframe.pdf { aspect-ratio: 8.5 / 11; max-height: 80dvh; }
  .media figcaption { font-size: .9rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .media figcaption a { color: var(--accent); }
  .modal-links { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 10px 22px; }
  .modal-links a { border-bottom: 1px solid var(--accent); padding-bottom: 1px; }
  .modal-links a:hover { color: var(--accent); }

  footer { padding: 40px 0 56px; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }

  @media (max-width: 960px) {
    .grid.three { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 720px) {
    .grid, .grid.three { grid-template-columns: 1fr; }
    .profile { grid-template-columns: 1fr; }
    #photo { width: min(100%, 340px); aspect-ratio: 3 / 4; min-height: 0; }
  }
  @media (max-width: 480px) {
    .skill-groups { grid-template-columns: 1fr; gap: 4px; }
    .skill-groups dd { margin-bottom: 8px; }
    .nav-name { display: none; }
    .nav .wrap { justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>
</head>

/* ============================================================ */

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text) n.textContent = text;
  return n;
};
const extLink = (label, url) => {
  const a = el("a", null, label);
  a.href = url; a.target = "_blank"; a.rel = "noopener";
  return a;
};
const chips = (list) => {
  const c = el("div", "chips");
  (list || []).forEach((x) => c.appendChild(el("span", null, x)));
  return c;
};

// Inline formatting in text: [label](url) makes a link, **text** makes bold.
const INLINE = /\[([^\]]+)\]\(([^)\s]+)\)|\*\*(.+?)\*\*/g;
function rich(text) {
  const frag = document.createDocumentFragment();
  let last = 0;
  for (const m of text.matchAll(INLINE)) {
    frag.append(text.slice(last, m.index));
    frag.append(m[1] ? extLink(m[1], m[2]) : el("strong", null, m[3]));
    last = m.index + m[0].length;
  }
  frag.append(text.slice(last));
  return frag;
}
const plain = (text) => text.replace(INLINE, (_, label, url, bold) => label || bold);

const TROPHY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg>';
const awards = (item) => {
  const list = [].concat(item.award || []);
  if (!list.length) return null;
  const a = el("div", "awards");
  list.forEach((x) => {
    const b = el("span"); b.innerHTML = TROPHY; b.append(x);
    a.appendChild(b);
  });
  return a;
};

/* --- media URL handling (Drive / YouTube / plain) --- */
const gdoc = (u) => u.match(/docs\.google\.com\/(document|presentation|spreadsheets)\/d\/([\w-]+)/);
const driveId = (u) => gdoc(u) ? gdoc(u)[2] : /drive\.google\.com/.test(u)
  ? ((u.match(/\/d\/([\w-]+)/) || u.match(/[?&]id=([\w-]+)/) || [])[1] || null) : null;
const ytId = (u) => /youtu\.?be/.test(u)
  ? ((u.match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/)([\w-]{11})/) || [])[1] || null) : null;
const imageSrc = (u, w) => { const d = driveId(u); return d ? `https://drive.google.com/thumbnail?id=${d}&sz=w${w}` : u; };

function thumbOf(m) {
  if (m.type === "image") return imageSrc(m.url, 1200);
  const y = ytId(m.url), d = driveId(m.url);
  if (y) return `https://img.youtube.com/vi/${y}/hqdefault.jpg`;
  if (d) return `https://drive.google.com/thumbnail?id=${d}&sz=w1200`;
  return null;
}
const coverOf = (item) => item.cover
  ? imageSrc(item.cover, 1200)
  : (item.media || []).map(thumbOf).find(Boolean) || null;

function mediaNode(m) {
  const fig = el("figure");
  const y = ytId(m.url), d = driveId(m.url), g = gdoc(m.url);
  if (m.type === "image") {
    const img = el("img"); img.src = imageSrc(m.url, 2000); img.alt = m.caption || ""; img.loading = "lazy";
    if (m.rotate) {
      const box = el("div", "rot"); box.style.setProperty("--r", m.rotate + "deg");
      img.onload = () => { box.style.aspectRatio = img.naturalHeight + " / " + img.naturalWidth; };
      box.appendChild(img); fig.appendChild(box);
    } else fig.appendChild(img);
  } else if (m.type === "video" && !y && !d) {
    const v = el("video"); v.src = m.url; v.controls = true; v.playsInline = true; v.preload = "metadata";
    fig.appendChild(v);
  } else {
    const f = el("iframe", m.type === "pdf" ? "pdf" : "video");
    f.src = y ? `https://www.youtube-nocookie.com/embed/${y}`
      : g ? `https://docs.google.com/${g[1]}/d/${g[2]}/preview` : d ? `https://drive.google.com/file/d/${d}/preview` : m.url;
    f.title = m.caption || m.type; f.loading = "lazy";
    f.allow = "autoplay; fullscreen; encrypted-media; picture-in-picture"; f.allowFullscreen = true;
    fig.appendChild(f);
  }
  const cap = el("figcaption");
  if (m.caption) cap.appendChild(el("span", null, m.caption));
  if (m.type === "pdf") cap.appendChild(extLink(g ? "Open document ↗" : "Open PDF ↗", m.url));
  if (m.link) cap.appendChild(extLink(m.link, m.url));
  if (cap.childNodes.length) fig.appendChild(cap);
  return fig;
}

/* --- cards --- */
function card(item) {
  const b = el("button", "card"); b.type = "button";
  const cover = el("div", "cover");
  const src = coverOf(item);
  if (src) {
    const img = el("img"); img.src = src; img.alt = ""; img.loading = "lazy";
    img.onerror = () => img.remove();
    cover.appendChild(img);
  }
  const body = el("div", "card-body");
  body.appendChild(el("h3", "card-title", item.title));
  const meta = [item.subtitle && plain(item.subtitle), item.date].filter(Boolean).join(" · ");
  if (meta) body.appendChild(el("p", "meta", meta));
  if (awards(item)) body.appendChild(awards(item));
  if (item.summary) body.appendChild(el("p", "summary", item.summary));
  body.appendChild(el("span", "more", "Details →"));
  b.append(cover, body);
  b.addEventListener("click", () => openItem(item));
  return b;
}

});

  integral: '<path d="M30 6c-6-2-8 2-8 8v20c0 6-2 10-8 8"/>'
};
// one repeating column of icons per bar: same size, same spacing, colours in a fixed cycle
const DECO_ORDER = ["gear", "wave", "atom", "resistor", "benzene", "integral", "circuit", "dna", "capacitor", "opamp"];
const DECO_COLORS = ["#2d4bff", "#14b8a6", "#f26b5b", "#e0a91b"];
function decoTile(offset) {
  const W = 52, STEP = 112, SIZE = 26;
  const icons = DECO_ORDER.map((_, i) => {
    const shape = DECO_ORDER[(i + offset) % DECO_ORDER.length];
    const color = DECO_COLORS[(i + offset) % DECO_COLORS.length];
    return `<g color="${color}" transform="translate(${(W - SIZE) / 2} ${i * STEP + (STEP - SIZE) / 2}) scale(${SIZE / 48})">${SHAPES[shape]}</g>`;
  }).join("");
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${DECO_ORDER.length * STEP}" fill="none" stroke="currentColor"`
    + ` stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">${icons}</svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
document.querySelectorAll(".deco-icons").forEach((n, i) => { n.style.backgroundImage = decoTile(i * 5); });

/* --- pop-up --- */
const modal = $("modal");
function mediaList(list) {
  const media = el("div", "media");
  list.forEach((m) => media.appendChild(mediaNode(m)));
  return media;
}
// A section: optional heading, then paragraphs, then an optional numbered list, then media.
function sectionNode(sec) {
  const node = el("div", "section");
  if (sec.heading) node.appendChild(el("h3", null, sec.heading));
  [].concat(sec.text || []).forEach((t) => { const para = el("p"); para.append(rich(t)); node.appendChild(para); });
  if (sec.list && sec.list.length) {
    const ol = el("ol");
    sec.list.forEach((t) => { const li = el("li"); li.append(rich(t)); ol.appendChild(li); });
    node.appendChild(ol);
  }
  if (sec.media && sec.media.length) node.appendChild(mediaList(sec.media));
  return node;
}
function openItem(item) {
  const body = $("modal-body");
  body.replaceChildren();
  const h = el("h2", null, item.title); h.id = "modal-title";
  body.appendChild(h);
  if (item.subtitle || item.date) {
    const meta = el("p", "meta");
    if (item.subtitle) meta.append(rich(item.subtitle));
    if (item.subtitle && item.date) meta.append(" · ");
    if (item.date) meta.append(item.date);
    body.appendChild(meta);
  }
  if (awards(item)) body.appendChild(awards(item));
  if (item.tags && item.tags.length) body.appendChild(chips(item.tags));
  if (item.sections && item.sections.length) {
    item.sections.forEach((sec) => body.appendChild(sectionNode(sec)));
  } else {
    const details = el("div", "details");
    (item.details && item.details.length ? item.details : [item.summary]).filter(Boolean)
      .forEach((p) => { const para = el("p"); para.append(rich(p)); details.appendChild(para); });
    body.appendChild(details);
    if (item.media && item.media.length) body.appendChild(mediaList(item.media));
  }
  if (item.links && item.links.length) {
    const links = el("div", "modal-links");
    item.links.forEach((l) => links.appendChild(extLink(l.label, l.url)));
    body.appendChild(links);
  }
  modal.showModal();
  modal.scrollTop = 0;
}
$("modal-close").addEventListener("click", () => modal.close());
modal.addEventListener("click", (e) => { if (e.target === modal) modal.close(); });
modal.addEventListener("close", () => $("modal-body").replaceChildren()); // stops any playing video
