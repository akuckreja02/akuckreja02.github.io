<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Name — Portfolio</title>
<meta name="description" content="Projects and leadership experience.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --soft: #f4f5f7;
    --ink: #15171c;
    --muted: #70757f;
    --line: #e6e7ea;
    --accent: #2d4bff;
    --font: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101114; --soft: #1a1c20; --ink: #f1f2f4; --muted: #8b909a; --line: #25272d; --accent: #7d92ff; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 72px; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--font); font-weight: 400; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  body:has(dialog[open]) { overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  img { max-width: 100%; display: block; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 56px); }

  /* nav */
  .nav {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 56px; }
  .nav-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-links { display: flex; gap: clamp(14px, 3vw, 28px); font-size: .95rem; color: var(--muted); }
  .nav-links a:hover { color: var(--ink); }

  /* profile */
  .profile {
    display: grid; grid-template-columns: auto 1fr; gap: clamp(24px, 5vw, 56px);
    padding: clamp(48px, 10vh, 96px) 0 clamp(40px, 8vh, 72px); align-items: start;
  }
  .photo {
    width: clamp(120px, 18vw, 180px); aspect-ratio: 1; border-radius: 50%;
    object-fit: cover; background: var(--soft);
    display: grid; place-items: center; font-size: 2.4rem; font-weight: 300; color: var(--muted);
  }
  h1 { font-size: clamp(2.2rem, 6vw, 4rem); font-weight: 300; line-height: 1.05; letter-spacing: -0.035em; }
  .tagline { margin-top: 10px; font-size: 1.15rem; color: var(--muted); }
  .bio { margin-top: 18px; max-width: 40em; }
  .contact { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: .95rem; }
  .contact a { border-bottom: 1px solid var(--accent); padding-bottom: 1px; }
  .contact a:hover { color: var(--accent); }
  .lists { margin-top: 28px; display: flex; flex-direction: column; gap: 22px; }
  .skill-groups { display: grid; grid-template-columns: max-content 1fr; gap: 10px 16px; align-items: baseline; }
  .skill-groups dt { font-size: .9rem; color: var(--muted); }
  .lists h3 { font-size: .8rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { font-size: .85rem; padding: 3px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); }
  .awards { display: flex; flex-wrap: wrap; gap: 6px; }
  .awards span {
    font-size: .8rem; font-weight: 500; padding: 3px 10px; border-radius: 999px;
    color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
  }

  /* sections */
  section.block { padding: clamp(40px, 8vh, 72px) 0; border-top: 1px solid var(--line); }
  h2.section-title { font-size: clamp(1.6rem, 3.5vw, 2.2rem); font-weight: 500; letter-spacing: -0.025em; margin-bottom: 28px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(16px, 2.5vw, 28px); }

  /* cards */
  .card {
    all: unset; box-sizing: border-box; cursor: pointer;
    display: flex; flex-direction: column;
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    background: var(--bg); transition: border-color .2s, transform .2s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .cover { aspect-ratio: 16 / 10; background: var(--soft); position: relative; }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .card-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card-title { font-size: 1.25rem; font-weight: 500; letter-spacing: -0.015em; line-height: 1.25; }
  .meta { font-size: .9rem; color: var(--muted); }
  .summary { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .more { margin-top: auto; padding-top: 4px; font-size: .9rem; color: var(--accent); }

  /* modal */
  dialog {
    width: min(760px, calc(100% - 32px)); max-height: calc(100dvh - 32px);
    margin: auto; border: 1px solid var(--line); border-radius: 16px;
    background: var(--bg); color: var(--ink); overflow-y: auto; overscroll-behavior: contain;
  }
  dialog::backdrop { background: rgba(10, 11, 14, .6); }
  .modal-inner { padding: clamp(22px, 4vw, 40px); padding-top: 8px; }
  .modal-close {
    position: sticky; top: 0; display: flex; justify-content: flex-end;
    padding: 12px 12px 0; background: linear-gradient(var(--bg) 70%, transparent);
  }
  .modal-close button {
    all: unset; cursor: pointer; width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center; font-size: 1.4rem; color: var(--muted); background: var(--soft);
  }
  .modal-close button:hover { color: var(--ink); }
  .modal-close button:focus-visible { outline: 2px solid var(--accent); }
  #modal-title { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 500; letter-spacing: -0.025em; line-height: 1.15; }
  .modal-inner .meta { margin-top: 6px; }
  .modal-inner .chips, .modal-inner .awards { margin-top: 14px; }
  .details { margin-top: 22px; display: flex; flex-direction: column; gap: 12px; }
  .media { margin-top: 28px; display: flex; flex-direction: column; gap: 24px; }
  .media figure { display: flex; flex-direction: column; gap: 8px; }
  .media img, .media video { width: 100%; border-radius: 10px; background: var(--soft); }
  .media iframe { width: 100%; border: 0; border-radius: 10px; background: var(--soft); }
  .media iframe.video { aspect-ratio: 16 / 9; }
  .media iframe.pdf { aspect-ratio: 8.5 / 11; max-height: 80dvh; }
  .media figcaption { font-size: .9rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .media figcaption a { color: var(--accent); }
  .modal-links { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 10px 22px; }
  .modal-links a { border-bottom: 1px solid var(--accent); padding-bottom: 1px; }
  .modal-links a:hover { color: var(--accent); }

  footer { padding: 40px 0 56px; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }

  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; }
    .profile { grid-template-columns: 1fr; }
  }
  @media (max-width: 480px) {
    .skill-groups { grid-template-columns: 1fr; gap: 4px; }
    .skill-groups dd { margin-bottom: 8px; }
    .nav-name { display: none; }
    .nav .wrap { justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<nav class="nav" aria-label="Sections">
  <div class="wrap">
    <a class="nav-name" id="nav-name" href="#top"></a>
    <div class="nav-links">
      <a href="#top">Profile</a>
      <a href="#projects">Projects</a>

<div class="wrap">

      <p class="tagline" id="tagline"></p>

  <main>
    <section class="block" id="projects">

    <section class="block" id="experience">

      <div class="grid" id="experience-grid"></div>
    </section>
  </main>

  <footer id="footer"></footer>
</div>

<dialog id="modal" aria-labelledby="modal-title">
  <div class="modal-close"><button type="button" id="modal-close" aria-label="Close">&times;</button></div>
  <div class="modal-inner" id="modal-body"></div>
</dialog>

<script>
/* ============================================================
   EDIT THESE BLOCKS ONLY. Everything on the page is generated from them.

   Media items: { type: "image" | "video" | "pdf", url: "...", caption: "..." }
   - Google Drive links work for all three (share as "Anyone with the link").
   - YouTube links work for video.
   - Plain image URLs or repo paths (e.g. "images/robot.jpg") work for images.
   - Google Docs links work for "pdf" too.
   Card cover: set `cover`, otherwise the first media item's thumbnail is used.
   `award` (optional): a string or a list of strings, shown as highlighted badges.
   `skills`: groups of tags, as { "Group name": ["Skill", ...] }.
   ============================================================ */
const SITE = {
  name: "Ansh Kuckreja",
  tagline: "Robotics, Electrical and Biomedical Engineering · Your school",
  photo: "https://drive.google.com/file/d/18ZTlIPgkbTTcAgv9K_AZyz_0p9VhBaQ5/view?usp=sharing",

  email: "you@example.com",
  links: [
    { label: "LinkedIn", url: "https://www.linkedin.com/in/anshkuckreja/" },
    { label: "GitHub", url: "https://github.com/akuckreja02" },
    { label: "Resume", url: "#" }
  ],
  interests: ["Robotics", "Biomedical engineering", "Systems engineering", "Electrical engineering"],
  skills: {
    "Languages": ["Python", "MATLAB", "Java", "C++", "SQL", "Verilog HDL"],
    "Robotics": ["ROS2", "KUKA", "Simulink", "Arduino", "LTSpice", "Keil μVision", "PCB (EasyEDA)", "Oscilloscopes", "Probes"],
    "CAD": ["SolidWorks", "Autodesk Inventor", "3D Printing"],
    "Tools": ["Git", "LaTeX", "Docker", "MS Suite", "Figma"]
  }
};

const PROJECTS = [
  {
    title: "Autonomous Robotic Needle Steering System",
    subtitle: "MSc Dissertation · Bristol Robotics Laboratory",
    date: "Jan – Sept 2026",
    award: "Best Communicated Dissertation 2026",
    summary: "Real-time closed-loop system to autonomously steer a needle during prostate radiotherapy.",
    tags: [],
    details: [],

    media: [
      { type: "video", url: "https://drive.google.com/file/d/1vPcwTd98-z-6N8gnB6Q3EB4LylGAq8WA/view?usp=sharing", caption: "Demo" },
      { type: "pdf",   url: "https://drive.google.com/file/d/172BSIv56dFKf0FIgW6fHW8mmRocKr61u/view?usp=sharing", caption: "Dissertation" }
    ],
    links: []
  },
  {

    date: "Sept 2024 – Apr 2025",
    award: "Grad to Watch",
    summary: "Designed and built a wearable sensing glove that captures and interprets muscle-force data for physicians during in-clinic muscle testing.",
    tags: [],
    details: [],
    media: [
      { type: "image", url: "https://drive.google.com/file/d/1LAY2Yfz3ZfD8EHsWT_QfceWrsF8QPyTO/view?usp=sharing" },
      { type: "image", url: "https://drive.google.com/file/d/1ttJvNUjAj6olzF6f5swZGXMEok4MrJgs/view?usp=sharing" },
      { type: "pdf",   url: "https://drive.google.com/file/d/1S0c6G8e1B4CSPhrEO2dz7o2vp-zb193J/view?usp=sharing", caption: "Capstone report" }
    ],
    links: []
  },
  {
    title: "Competitive Sumobot",
    subtitle: "",
    date: "",
    award: "4th place in university competition, qualified for provincials",
    summary: "Autonomous competitive sumobot built to a maximum of 10 cm × 10 cm and under 500 g.",
    tags: [],
    details: [],
    media: [
      { type: "image", url: "https://drive.google.com/file/d/1dqQDs29JoPU_jLvAZK07F-65Q2qh7LLd/view?usp=sharing" },
      { type: "video", url: "https://drive.google.com/file/d/1LhmIECRRHSK9SymXpvE2y92HuAdvdtAF/view?usp=sharing", caption: "Match footage" }
    ],
    links: [{ label: "Sumobot competition", url: "https://www.sumobot.ca/" }]
  },
  {
    title: "Leader-Follower Robotic System",
    subtitle: "Robotic Science and Systems (course)",
    date: "Sept – Dec 2025",
    summary: "Evaluated the performance of a single- versus dual-emitter IR leader-follower robotic system using Raspberry Pi 3 robots.",
    tags: [],
    details: [],
    media: [
      { type: "image", url: "https://drive.google.com/file/d/1iDoZ9xxXfxfwIWMndVLwbXzb8FbY2o2A/view?usp=sharing" },
      { type: "pdf",   url: "https://drive.google.com/file/d/1jvAatO4Tai_snKUVM5X4d-uUdC_vWoPN/view?usp=sharing", caption: "Paper" }
    ],
    links: []
  },
  {
    title: "Motorized Prosthetic Hand",
    subtitle: "McMaster Medical Engineering Design Team (MED-T)",
    date: "Sept 2022 – Apr 2023",
    summary: "Collected muscle contraction data for the software sub-team of a motorized prosthetic hand, and wrote an extensive guide to filtering EMG signals for future sub-team members.",
    tags: [],

    media: [
      { type: "image", url: "https://drive.google.com/file/d/1lFhrJhPjsEgquyI54kl1tFlVO-bKcSXY/view?usp=sharing" },
      { type: "pdf",   url: "https://docs.google.com/document/d/17GQfiK8Mi8lVD5p3hvJ5owsHCLwbuF_1KxIGaQchMDc/edit?usp=sharing", caption: "EMG filtering guide" }
    ],

  },
  {
    title: "Autonomous Environment-Mapping Robot",
    subtitle: "Microprocessor Systems Project (course)",
    date: "Jan – Apr 2022",
    award: "Grade: A+",
    summary: "Autonomous robot that maps its surrounding environment.",
    tags: [],
    details: [],
    media: [
      { type: "image", url: "https://drive.google.com/file/d/10wpkSv9zVfdhCtCElrzm88cmAepqexcn/view?usp=sharing" },
      { type: "video", url: "https://drive.google.com/file/d/1CM3Itgc0AjKyjn7UVOLWTmyb2hmGNCXE/view?usp=sharing", caption: "Demo" },
      { type: "pdf",   url: "https://drive.google.com/file/d/1QAWx2gcCuobVXOZZjDoMlywp-kMDwjCc/view?usp=sharing", caption: "Project report" }
    ],
    links: []
  }
];

const EXPERIENCE = [
  {
    title: "Role title",
    subtitle: "Organization",
    date: "2024 – present",
    summary: "One or two sentences shown on the card.",
    tags: [],
    details: ["Longer description shown in the pop-up."],
    media: [],
    links: []
  },
  {
    title: "Role title",
    subtitle: "Organization",
    date: "2023 – 2024",
    summary: "One or two sentences shown on the card.",
    tags: [],
    details: ["Longer description shown in the pop-up."],
    media: [],
    links: []
  }
];
/* ============================================================ */

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text) n.textContent = text;
  return n;
};
const extLink = (label, url) => {
  const a = el("a", null, label);
  a.href = url; a.target = "_blank"; a.rel = "noopener";
  return a;
};
const chips = (list) => {
  const c = el("div", "chips");
  (list || []).forEach((x) => c.appendChild(el("span", null, x)));
  return c;
};

const awards = (item) => {
  const list = [].concat(item.award || []);
  if (!list.length) return null;
  const a = el("div", "awards");
  list.forEach((x) => a.appendChild(el("span", null, x)));
  return a;
};

/* --- media URL handling (Drive / YouTube / plain) --- */
const gdoc = (u) => u.match(/docs\.google\.com\/(document|presentation|spreadsheets)\/d\/([\w-]+)/);
const driveId = (u) => gdoc(u) ? gdoc(u)[2] : /drive\.google\.com/.test(u)
  ? ((u.match(/\/d\/([\w-]+)/) || u.match(/[?&]id=([\w-]+)/) || [])[1] || null) : null;
const ytId = (u) => /youtu\.?be/.test(u)
  ? ((u.match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/)([\w-]{11})/) || [])[1] || null) : null;
const imageSrc = (u, w) => { const d = driveId(u); return d ? `https://drive.google.com/thumbnail?id=${d}&sz=w${w}` : u; };

function thumbOf(m) {
  if (m.type === "image") return imageSrc(m.url, 1200);
  const y = ytId(m.url), d = driveId(m.url);
  if (y) return `https://img.youtube.com/vi/${y}/hqdefault.jpg`;
  if (d) return `https://drive.google.com/thumbnail?id=${d}&sz=w1200`;
  return null;
}
const coverOf = (item) => item.cover
  ? imageSrc(item.cover, 1200)
  : (item.media || []).map(thumbOf).find(Boolean) || null;

function mediaNode(m) {
  const fig = el("figure");
  const y = ytId(m.url), d = driveId(m.url), g = gdoc(m.url);
  if (m.type === "image") {
    const img = el("img"); img.src = imageSrc(m.url, 2000); img.alt = m.caption || ""; img.loading = "lazy";
    fig.appendChild(img);
  } else if (m.type === "video" && !y && !d) {
    const v = el("video"); v.src = m.url; v.controls = true; v.playsInline = true; v.preload = "metadata";
    fig.appendChild(v);
  } else {
    const f = el("iframe", m.type === "pdf" ? "pdf" : "video");
    f.src = y ? `https://www.youtube-nocookie.com/embed/${y}`
      : g ? `https://docs.google.com/${g[1]}/d/${g[2]}/preview` : d ? `https://drive.google.com/file/d/${d}/preview` : m.url;
    f.title = m.caption || m.type; f.loading = "lazy";
    f.allow = "autoplay; fullscreen; encrypted-media; picture-in-picture"; f.allowFullscreen = true;
    fig.appendChild(f);
  }
  const cap = el("figcaption");
  if (m.caption) cap.appendChild(el("span", null, m.caption));
  if (m.type === "pdf") cap.appendChild(extLink(g ? "Open document ↗" : "Open PDF ↗", m.url));
  if (cap.childNodes.length) fig.appendChild(cap);
  return fig;
}

/* --- profile --- */
document.title = SITE.name + " — Portfolio";
$("nav-name").textContent = SITE.name;
$("name").textContent = SITE.name;
$("tagline").textContent = SITE.tagline;
$("bio").textContent = SITE.bio;
if (SITE.photo) {
  const img = el("img", "photo"); img.src = imageSrc(SITE.photo, 600); img.alt = SITE.name;
  $("photo").appendChild(img);
} else {
  const initials = SITE.name.split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();
  $("photo").appendChild(el("div", "photo", initials));
}
const mail = el("a", null, SITE.email); mail.href = "mailto:" + SITE.email;
$("contact").appendChild(mail);
SITE.links.forEach((l) => $("contact").appendChild(extLink(l.label, l.url)));
Object.entries(SITE.skills).forEach(([group, list]) => {
  const dd = el("dd"); dd.appendChild(chips(list));
  $("skills").append(el("dt", null, group), dd);
});
$("interests").replaceWith(Object.assign(chips(SITE.interests), { id: "interests" }));
$("footer").textContent = "© " + new Date().getFullYear() + " " + SITE.name;

/* --- cards --- */
function card(item) {
  const b = el("button", "card"); b.type = "button";
  const cover = el("div", "cover");
  const src = coverOf(item);
  if (src) {
    const img = el("img"); img.src = src; img.alt = ""; img.loading = "lazy";
    img.onerror = () => img.remove();
    cover.appendChild(img);
  }
  const body = el("div", "card-body");
  body.appendChild(el("h3", "card-title", item.title));
  const meta = [item.subtitle, item.date].filter(Boolean).join(" · ");
  if (meta) body.appendChild(el("p", "meta", meta));
  if (awards(item)) body.appendChild(awards(item));
  if (item.summary) body.appendChild(el("p", "summary", item.summary));
  if (item.tags && item.tags.length) body.appendChild(chips(item.tags));
  body.appendChild(el("span", "more", "Details →"));
  b.append(cover, body);
  b.addEventListener("click", () => openItem(item));
  return b;
}
PROJECTS.forEach((p) => $("project-grid").appendChild(card(p)));
EXPERIENCE.forEach((x) => $("experience-grid").appendChild(card(x)));

/* --- pop-up --- */
const modal = $("modal");
function openItem(item) {
  const body = $("modal-body");
  body.replaceChildren();
  const h = el("h2", null, item.title); h.id = "modal-title";
  body.appendChild(h);
  const meta = [item.subtitle, item.date].filter(Boolean).join(" · ");
  if (meta) body.appendChild(el("p", "meta", meta));
  if (awards(item)) body.appendChild(awards(item));
  if (item.tags && item.tags.length) body.appendChild(chips(item.tags));
  const details = el("div", "details");
  (item.details && item.details.length ? item.details : [item.summary]).filter(Boolean)
    .forEach((p) => details.appendChild(el("p", null, p)));
  body.appendChild(details);
  if (item.media && item.media.length) {
    const media = el("div", "media");
    item.media.forEach((m) => media.appendChild(mediaNode(m)));
    body.appendChild(media);
  }
  if (item.links && item.links.length) {
    const links = el("div", "modal-links");
    item.links.forEach((l) => links.appendChild(extLink(l.label, l.url)));
    body.appendChild(links);
  }
  modal.showModal();
  modal.scrollTop = 0;
}
$("modal-close").addEventListener("click", () => modal.close());
modal.addEventListener("click", (e) => { if (e.target === modal) modal.close(); });
modal.addEventListener("close", () => $("modal-body").replaceChildren()); // stops any playing video
</script>
</body>
</html>
